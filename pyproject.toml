# pyproject.toml
# Purpose: project metadata + pinned dev tooling + lint/test config, managed by `uv`.
# Why: reproducible environments (uv.lock) and a single source of truth for tool settings, from
#      day one — before pipeline deps (dbt/airflow/…) land with their phases.
[project]
name = "bikeshare-lakehouse"
version = "0.0.0"
description = "Local-first open lakehouse for public bike-share data (Data Vault 2.0 -> Kimball)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Toghrul Jafarov" }]
# Runtime deps grow per phase. Phase 1 (ingestion): HTTP client, retry, S3/MinIO.
dependencies = [
  "httpx>=0.27",
  "tenacity>=9",
  "boto3>=1.35",
]

# Dev/test tooling. Later pipeline deps (dbt-duckdb, pyiceberg, apache-airflow, soda-core)
# join as their phases are built.
[dependency-groups]
dev = [
  "ruff>=0.8",
  "sqlfluff>=3.2",
  "pytest>=8",
  "pre-commit>=4",
  "respx>=0.21",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["ingestion", "orchestration", "chaos"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
