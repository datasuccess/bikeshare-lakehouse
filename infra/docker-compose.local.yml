# docker-compose.local.yml — the local $0 stack (Phase 1: MinIO only).
# Purpose: give ingestion somewhere to land raw data — a local S3 (MinIO) + the lake bucket.
# Why: MinIO is S3-API-compatible, so the SAME ingestion code targets AWS S3 later (ADR-002).
# Grows later: Postgres (vault engine), Airflow (Phase 6), Grafana (Phase 8).
# Usage: `make up` (start) · console at http://localhost:9001 · `make down` (stop).
name: bikeshare-lakehouse

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Iceberg REST catalog — the registry that turns files into named tables.
  # Mirrors AWS Glue (also a REST catalog), so local↔cloud uses the same protocol (ADR-006).
  # NOTE: the fixture keeps catalog state in-memory — it resets on restart; re-run `make land`.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CATALOG_WAREHOUSE: s3://${LAKE_BUCKET:-bikeshare-lake}/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"   # Iceberg REST API

  # One-shot: wait for MinIO, then create the lake bucket. Exits when done.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      LAKE_BUCKET: ${LAKE_BUCKET:-bikeshare-lake}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${AWS_ACCESS_KEY_ID} $${AWS_SECRET_ACCESS_KEY} &&
      mc mb -p local/$${LAKE_BUCKET} &&
      echo 'bucket ready: '$${LAKE_BUCKET}
      "

volumes:
  minio-data:
