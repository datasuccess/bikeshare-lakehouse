# .pre-commit-config.yaml
# Purpose: cheap, fast repo hygiene + secret-scanning on every commit and in CI.
# Why: never commit secrets; keep formatting/whitespace clean; lint as soon as code exists.
# Note: ruff/sqlfluff hooks activate once Python/dbt code lands (Phase 1+); the hygiene +
#       secret-scan hooks work from day one.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
      - id: ruff-format

  # Enabled once dbt models exist (Phase 3+):
